# Moon's browser audio endpoint. Chromium's Linux audio service supplies
# 48 kHz stereo signed-16-bit PCM; the file PCM plugin streams those frames to
# Moon's pre-authorized Android AudioTrack bridge without exposing /dev/snd.
pcm.moon_null {
  type null
}

pcm.!default {
  type file
  slave.pcm "moon_null"
  file "/run/moon-audio/pcm"
  format "raw"
}
